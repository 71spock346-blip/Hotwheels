<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Original mark in the classic die-cast branding treatment: vivid red swoosh
    with a navy keyline and yellow accents on white. Deliberately NOT the
    Mattel logo or wordmark - shipping the real one would be a trademark
    violation and a Play Store takedown. Palette echoes the brand; the shapes
    are ours: a five-spoke wheel streaming flame, not their flame silhouette.
  -->
  <defs>
    <linearGradient id="rim" x1="0" y1="-80" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd100"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <radialGradient id="card" cx="0.47" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#eef5ff"/>
      <stop offset="0.72" stop-color="#7fb2ea"/>
      <stop offset="0.9" stop-color="#1476d1"/>
      <stop offset="1" stop-color="#0f63b8"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#card)"/>

  <g transform="translate(252 256) scale(1.13) translate(-252 -256)">

  <!-- Flame swoosh streaming off the wheel, licks on top, curled tail. -->
  <path
    fill="#e8231d" stroke="#00295d" stroke-width="13" stroke-linejoin="round"
    d="M 344 170
       C 286 152 244 162 208 182
       C 214 164 208 146 192 134
       C 176 154 158 168 134 180
       C 137 165 131 150 118 142
       C 98 160 76 178 52 196
       C 40 206 32 220 37 236
       C 50 228 64 226 82 231
       C 132 244 180 262 224 292
       C 262 318 300 336 344 340
       Z"/>

  <!-- Yellow heat streak inside the swoosh. -->
  <path
    fill="url(#rim)"
    d="M 330 216
       C 270 200 220 206 172 220
       C 150 226 122 230 100 226
       C 130 244 168 254 210 266
       C 252 278 296 292 330 296
       Z"/>

  <!-- The wheel: navy tyre, yellow rim, five navy spokes. -->
  <g transform="translate(352 256)">
    <circle r="122" fill="#00295d"/>
    <circle r="104" fill="#e8231d"/>
    <circle r="82" fill="url(#rim)"/>
    <g stroke="#00295d" stroke-width="15" stroke-linecap="round">
      <path d="M0 -28 L0 -70"/>
      <path d="M27 -9 L67 -22"/>
      <path d="M17 23 L41 57"/>
      <path d="M-17 23 L-41 57"/>
      <path d="M-27 -9 L-67 -22"/>
    </g>
    <circle r="26" fill="#00295d"/>
    <circle r="11" fill="#ffd100"/>
  </g>
  </g>
</svg>
