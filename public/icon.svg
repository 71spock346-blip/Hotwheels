<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Showcase treatment: dark glossy garage, gold frame, a shiny blue racer,
    and OUR flaming-wheel mark up top. Deliberately not the Mattel logo or
    wordmark - shipping the real one would be a trademark violation and a
    Play Store takedown. The mood is the collector's display case; the marks
    and the car are ours.
  -->
  <defs>
    <radialGradient id="garage" cx="0.5" cy="0.34" r="0.95">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="0.55" stop-color="#171a21"/>
      <stop offset="1" stop-color="#08090c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.35" stop-color="#e9b94a"/>
      <stop offset="0.65" stop-color="#a86f12"/>
      <stop offset="1" stop-color="#e3b84f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="270" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6cb0ff"/>
      <stop offset="0.45" stop-color="#2f7de4"/>
      <stop offset="1" stop-color="#0a3f92"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="-80" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd100"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="404" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f74c9" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3f74c9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#garage)"/>

  <!-- Floor glow and car shadow. -->
  <rect x="30" y="398" width="452" height="84" fill="url(#floor)"/>
  <ellipse cx="260" cy="404" rx="185" ry="13" fill="#000000" opacity="0.55"/>

  <!-- Our mark, scaled to sit as the badge up top. -->
  <g transform="translate(256 138) scale(0.56) translate(-252 -250)">
    <path
      fill="#e8231d" stroke="#f2cf6e" stroke-width="14" stroke-linejoin="round"
      d="M 344 170
         C 286 152 244 162 208 182
         C 214 164 208 146 192 134
         C 176 154 158 168 134 180
         C 137 165 131 150 118 142
         C 98 160 76 178 52 196
         C 40 206 32 220 37 236
         C 50 228 64 226 82 231
         C 132 244 180 262 224 292
         C 262 318 300 336 344 340
         Z"/>
    <path
      fill="url(#rim)"
      d="M 330 216
         C 270 200 220 206 172 220
         C 150 226 122 230 100 226
         C 130 244 168 254 210 266
         C 252 278 296 292 330 296
         Z"/>
    <g transform="translate(352 256)">
      <circle r="122" fill="#f2cf6e"/>
      <circle r="104" fill="#e8231d"/>
      <circle r="82" fill="url(#rim)"/>
      <g stroke="#14161c" stroke-width="15" stroke-linecap="round">
        <path d="M0 -28 L0 -70"/>
        <path d="M27 -9 L67 -22"/>
        <path d="M17 23 L41 57"/>
        <path d="M-17 23 L-41 57"/>
        <path d="M-27 -9 L-67 -22"/>
      </g>
      <circle r="26" fill="#14161c"/>
      <circle r="11" fill="#ffd100"/>
    </g>
  </g>

  <!-- The racer: low wedge, big rear wing, red rocker stripe, redline wheels. -->
  <g>
    <!-- Rear wing first, so the body overlaps its pylon. -->
    <path fill="#0a3f92" stroke="#071c3f" stroke-width="4" stroke-linejoin="round"
      d="M 374 297 L 452 287 L 453 298 L 377 308 Z"/>
    <rect x="447" y="283" width="9" height="20" rx="2" fill="#071c3f"/>
    <path fill="#123c7d" stroke="#071c3f" stroke-width="3"
      d="M 398 318 L 406 300 L 418 300 L 412 320 Z"/>

    <path
      fill="url(#body)" stroke="#071c3f" stroke-width="5" stroke-linejoin="round"
      d="M 76 344
         C 74 334 80 326 96 322
         L 206 314
         C 226 296 244 288 262 286
         L 298 286
         C 330 290 356 302 378 314
         L 414 318
         C 430 322 438 334 436 350
         L 434 372
         L 398 372
         A 32 32 0 0 0 334 372
         L 190 372
         A 32 32 0 0 0 126 372
         L 84 372
         C 78 366 75 356 76 344
         Z"/>
    <!-- Glasshouse -->
    <path
      fill="#0c1727" stroke="#071c3f" stroke-width="3"
      d="M 216 314
         C 232 298 248 292 264 290
         L 296 290
         C 318 293 338 302 354 312
         L 344 317
         L 224 319
         Z"/>
    <path fill="#bcd8ff" opacity="0.4"
      d="M 232 312 C 244 299 256 293 270 292 L 284 291 L 254 314 Z"/>
    <!-- Hood and roof gloss -->
    <path fill="#ffffff" opacity="0.16"
      d="M 104 326 L 204 318 C 224 300 244 292 262 290 L 250 302 C 236 308 224 314 212 320 L 108 330 Z"/>
    <!-- Side intake ahead of the rear arch -->
    <path fill="#0c1727" d="M 316 330 L 344 326 L 339 346 L 314 348 Z"/>
    <!-- Rocker stripe -->
    <path fill="#e8231d" d="M 92 350 L 430 342 L 429 356 L 96 362 Z"/>
    <!-- Headlight and splitter -->
    <path fill="#fff4c2" d="M 80 336 L 100 331 L 102 341 L 82 346 Z"/>
    <path fill="#071c3f" d="M 70 366 L 96 364 L 96 372 L 74 372 Z"/>
    <!-- Wheels: redlines, the collector's tell. -->
    <g transform="translate(158 372)">
      <circle r="32" fill="#0e1013" stroke="#000" stroke-width="2"/>
      <circle r="22" fill="#1a1c22" stroke="#e8231d" stroke-width="4"/>
      <circle r="13" fill="#d7dde8"/>
      <circle r="4.5" fill="#333a45"/>
    </g>
    <g transform="translate(366 372)">
      <circle r="32" fill="#0e1013" stroke="#000" stroke-width="2"/>
      <circle r="22" fill="#1a1c22" stroke="#e8231d" stroke-width="4"/>
      <circle r="13" fill="#d7dde8"/>
      <circle r="4.5" fill="#333a45"/>
    </g>
  </g>

  <!-- Gold display-case frame. -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none"
        stroke="url(#gold)" stroke-width="17"/>
  <rect x="31" y="31" width="450" height="450" rx="80" fill="none"
        stroke="#000000" stroke-opacity="0.45" stroke-width="3"/>
</svg>
